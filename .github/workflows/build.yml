name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc-car-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rc-car.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest rc-car.apk --title "Latest build" --notes "Built from commit ${GITHUB_SHA}" --target "${GITHUB_SHA}"
          
